services:
  satisfactory:
    image: wolveix/satisfactory-server:latest
    container_name: satisfactory
    hostname: satisfactory
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./config:/config
    environment:
      MAXPLAYERS: "8"
      MAXTICKRATE: "30"
      PUID: "1000"
      PGID: "1000"
      STEAMBETA: "false"
      AUTOPAUSE: "true"
      AUTOSAVENUM: "10"
      AUTOSAVEINTERVAL: "300"
      AUTOSAVEONDISCONNECT: "true"
      DISABLESEASONALEVENTS: "false"
      ROOTLESS: "false"
      SKIPUPDATE: "false"
      TIMEOUT: "30"
      LOG: "true"
    command:
      - "-ini:Engine:[/Script/Engine.Player]:ConfiguredInternetSpeed=104857600"
      - "-ini:Engine:[/Script/Engine.Player]:ConfiguredLanSpeed=104857600"
      - "-ini:Engine:[/Script/OnlineSubsystemUtils.IpNetDriver]:MaxClientRate=104857600"
      - "-ini:Engine:[/Script/OnlineSubsystemUtils.IpNetDriver]:MaxInternetClientRate=104857600"
      - "-ini:Engine:[/Script/SteamSockets.SteamSocketsNetDriver]:MaxClientRate=104857600"
      - "-ini:Engine:[/Script/SteamSockets.SteamSocketsNetDriver]:MaxInternetClientRate=104857600"
      - "-ini:Engine:[/Script/SocketSubsystemEOS.NetDriverEOS]:MaxClientRate=104857600"
      - "-ini:Engine:[/Script/SocketSubsystemEOS.NetDriverEOS]:MaxInternetClientRate=104857600"
      - "-ini:Game:[/Script/Engine.GameNetworkManager]:TotalNetBandwidth=104857600"
      - "-ini:Game:[/Script/Engine.GameNetworkManager]:MaxDynamicBandwidth=104857600"
      - "-ini:Game:[/Script/Engine.GameNetworkManager]:MinDynamicBandwidth=10485760"
    mem_limit: 20g
    mem_reservation: 8g
