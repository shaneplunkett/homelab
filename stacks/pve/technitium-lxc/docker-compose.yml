services:
  dns-server:
    image: technitium/dns-server:15.4.0
    container_name: technitium
    hostname: technitium
    restart: unless-stopped
    ports:
      - "5380:5380/tcp" # web console
      - "53:53/udp"
      - "53:53/tcp"
    environment:
      DNS_SERVER_DOMAIN: technitium
      DNS_SERVER_RECURSION: AllowOnlyForPrivateNetworks
      DNS_SERVER_ADMIN_PASSWORD_FILE: /run/secrets/admin-password
      # keep only the last hour of stats in memory; dashboard history is on disk
      DNS_SERVER_ENABLE_IN_MEMORY_STATS: "true"
    secrets:
      - admin-password
    sysctls:
      # recursive resolver needs a wide ephemeral source-port range (bridge mode)
      - net.ipv4.ip_local_port_range=1024 65535
    volumes:
      - config:/etc/dns

secrets:
  admin-password:
    file: ./admin-password.txt

volumes:
  config:
